<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Grid — Live Colony</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#090713;color:#e8e3f7}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #332b4d;padding-bottom:14px;margin-bottom:20px}h1{font-size:22px;margin:0}.live{color:#7cffc4}.live:before{content:'●';margin-right:8px;animation:p 1.5s infinite}@keyframes p{50%{opacity:.25}}main{display:grid;grid-template-columns:minmax(320px,2fr) minmax(260px,1fr);gap:22px}canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;border:1px solid #40365c;background:#111}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#121020;border:1px solid #2d2742;padding:12px}.label{color:#8a82a8;font-size:11px;text-transform:uppercase}.value{display:block;font-size:21px;margin-top:5px}.wide{grid-column:1/-1}.bar{height:7px;background:#28223b;margin-top:8px}.bar i{display:block;height:100%;background:#7fe9ff}.events{margin-top:16px;max-height:230px;overflow:auto;padding:0;list-style:none}.events li{padding:7px 0;border-bottom:1px solid #262039;color:#bdb6d2;font-size:12px}.genome{word-break:break-all;color:#c9a6ff;font-size:12px}.error{color:#ff7a68}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:14px}}
</style></head><body>
<header><div><h1>THE GRID</h1><span class="label">persistent artificial-life habitat</span></div><div id="status" class="live">LIVE</div></header>
<main><canvas id="grid" width="32" height="32"></canvas><section><div class="stats">
<div class="card"><span class="label">Epoch</span><b class="value" id="epoch">—</b></div><div class="card"><span class="label">Tick</span><b class="value" id="tick">—</b></div>
<div class="card"><span class="label">Population</span><b class="value" id="pop">—</b></div><div class="card"><span class="label">Generation</span><b class="value" id="gen">—</b></div>
<div class="card"><span class="label">Births</span><b class="value" id="births">—</b></div><div class="card"><span class="label">Deaths</span><b class="value" id="deaths">—</b></div>
<div class="card wide"><span class="label">Memory pressure</span><b class="value" id="mem">—</b><div class="bar"><i id="mbar"></i></div></div>
<div class="card wide"><span class="label">Heat / metabolic cost</span><b class="value" id="heat">—</b></div>
<div class="card wide"><span class="label">Dominant genome</span><div class="genome" id="genome">—</div></div></div>
<ul class="events" id="events"></ul></section></main>
<script>
const A='0123456789abcdefghijklmnopqrstuv', ramp=['#171331','#241a4d','#3a1f63','#56206e','#75216f','#94266a','#b4305c','#d24a45','#ea7128','#ffb03a'], strains=['#7fe9ff','#7cffc4','#c9a6ff','#fff','#ff9bd2','#c3ff6b'];
const c=document.querySelector('canvas'),x=c.getContext('2d');let failures=0;
function text(id,v){document.getElementById(id).textContent=v}function draw(d){c.width=d.width;c.height=d.height;for(let i=0;i<d.energy.length;i++){x.fillStyle=ramp[+d.energy[i]]||ramp[0];x.fillRect(i%d.width,Math.floor(i/d.width),1,1)}for(let i=0;i<d.organisms.length;i+=3){const n=A.indexOf(d.organisms[i])*32+A.indexOf(d.organisms[i+1]);x.fillStyle=strains[A.indexOf(d.organisms[i+2])%strains.length];x.fillRect(n%d.width,Math.floor(n/d.width),1,1)}}
async function update(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();failures=0;document.getElementById('status').className='live';text('status','LIVE');draw(d);text('epoch',d.epoch);text('tick',d.tick.toLocaleString());text('pop',d.population);text('gen',d.generation);text('births',d.births.toLocaleString());text('deaths',d.deaths.toLocaleString());text('mem',Math.round(d.memory*100)+'%');document.getElementById('mbar').style.width=(d.memory*100)+'%';text('heat',d.heat+' / ×'+d.cost);const names=[...d.dominant].map(q=>d.isa[A.indexOf(q)]||'?');text('genome',names.join(' · ')+' ('+d.carriers+' carriers)');document.getElementById('events').innerHTML=d.events.slice().reverse().map(e=>'<li><b>'+e.tick+'</b> — '+e.text+'</li>').join('')||'<li>Watching for significant events…</li>'}catch(e){if(++failures>2){const s=document.getElementById('status');s.className='error';s.textContent='RECONNECTING'}}}
update();setInterval(update,500);
</script></body></html>
