[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thegrid"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "aiohttp>=3.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
