<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Grid — Fleet</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#090713;color:#e8e3f7}
*{box-sizing:border-box}
body{margin:0 auto;padding:14px;max-width:2400px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #332b4d;padding-bottom:8px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.1em}
.ctl{display:flex;align-items:center;gap:8px;font-size:10px;color:#6f668f}
.ctl input[type=range]{width:150px;accent-color:#68dfff}
#rate{color:#68dfff;min-width:52px;text-align:right}
#meta{font-size:10px;color:#6f668f}
#fps{color:#4a4363}
#fleet{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
@media(min-width:1500px){#fleet{grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr))}}
.col{background:#121020;border:1px solid #2d2742;padding:9px;display:flex;flex-direction:column;gap:7px}
.col.down{border-color:#5c2333;opacity:.65}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.nm{font-size:13px;letter-spacing:.06em}
.ep{font-size:10px;color:#6f668f}
.feat{font-size:9px;color:#68dfff;letter-spacing:.04em;min-height:11px}
.feat .none{color:#4a4363}
.body{display:flex;gap:9px}
canvas{image-rendering:pixelated;border:1px solid #241f36;flex:0 0 auto;width:clamp(180px,38%,300px);height:auto;align-self:flex-start}
.stats{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11px;align-content:start;flex:1;min-width:0}
@media(min-width:1500px){.stats{grid-template-columns:auto 1fr auto 1fr;gap:2px 10px}}
.k{color:#6f668f;white-space:nowrap;cursor:help;border-bottom:1px dotted #3a3358}
.v{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warn{color:#ff8fa3}
.bar{height:3px;background:#241f36;margin-top:2px}
.bar i{display:block;height:100%;background:#68dfff;transition:width .3s}
.gen{font-size:10px;color:#8d84ad;word-break:break-all;line-height:1.25;max-height:26px;overflow:hidden}
</style></head><body>
<header>
  <h1>THE GRID // FLEET</h1>
  <div class="ctl"><label for="hz">refresh</label>
    <input id="hz" type="range" min="0" max="7" step="1" value="5">
    <span id="rate">3s</span></div>
  <span id="meta">connecting…</span>
</header>
<div id="fleet"></div>
<script>
// Palette and compositing lifted verbatim from live_viewer.html so a colony
// looks identical here and on its own page. Energy is encoded as a digit 0-9
// (record.encode_energy), which is why the ramp has ten entries.
const S=6, A='0123456789abcdefghijklmnopqrstuv';
const ramp=['#171331','#241a4d','#3a1f63','#56206e','#75216f','#94266a','#b4305c','#d24a45','#ea7128','#ffb03a'];
const strains=['#7fe9ff','#7cffc4','#c9a6ff','#fff','#ff9bd2','#c3ff6b','#ffb03a','#68dfff','#ff7a68','#a98bff','#63e6be','#ffd6a5','#f4a261'];
const biomeColors=['#8fcf72','#d7a84b','#6fb3a8','#9b7bd3'];
function mix(a,b,t){const q=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const u=q(a),v=q(b);
return '#'+u.map((n,i)=>Math.round(n+(v[i]-n)*t).toString(16).padStart(2,'0')).join('')}
const STEPS=[100,200,250,500,1000,3000,5000,10000];
const LABEL=['100ms','200ms','250ms','500ms','1s','3s','5s','10s'];
// label, id, and what the number actually is - taken from how live.py computes
// it, not from what the label sounds like.
const ROWS=[
 ['pop','population','Organisms alive right now in this colony.'],
 ['generation','generation','The HIGHEST generation among living organisms - how many ancestors deep the deepest survivor is. Not an average, and it resets to 0 when the colony goes extinct and reseeds.'],
 ['complexity','complexity','Median / maximum number of DISTINCT opcodes an organism carries that the 9-instruction ancestor did not have. Counts acquired capability, not genome length, so padding a genome does not raise it.'],
 ['tasks solved','tasks','How many of the 7 logic tasks (nand, not, and, or, orn, xor, forecast) have been solved at least once THIS epoch. Resets on reseed.'],
 ['groups','groups','Organisms bound into units of 2 or more via the link instruction, and how many such units. A bound group is copied as one: a member can drop its own alloc/copy/fork and still be inherited by whichever groupmate replicates.'],
 ['steals','steals','Times the steal instruction has run this epoch. Each takes up to 4 energy from an adjacent organism as a strict transfer - the thief gains exactly what the victim loses.'],
 ['corrupted','corrupted','Times the corrupt instruction has run - writing a value into a NEIGHBOUR\'s genome. Moves no energy; it destroys structure. The only defence reachable from this instruction set is redundancy.'],
 ['predators','predators','Living organisms whose genome carries steal or corrupt. In a colony without the predation feature these instructions are inert nops, so a non-zero count there is drift, not behaviour.'],
 ['bus w/r','bus','Writes and reads on the 16-word shared bus (post / fetch). Unlike a signal it does not attenuate, expire, or respect a quadrant boundary - the only channel in this world with no geometry.'],
 ['macro runs','macros','Invocations of the eight macro opcodes, whose meaning the population authors via define. Historical counts persist across epochs, so a colony that has had the macro feature removed keeps its old total.'],
 ['bounties','bounties','Bounties claimed: an organism escrowed energy at a bus address for a wanted value, and somebody else posted that value and collected. Value the population set itself rather than the task list.'],
 ['burns','burns','Times the burn instruction has run, each spending real CPU on Odin. This warms the chip and eats scheduler time, which raises instruction cost and lowers income for EVERY colony on the box.'],
 ['lease','lease','Lease heartbeats sent and how many carried the correct quadrant. Where the lease feature is on, ageing is switched off and an organism must post to renew or be reclaimed: posting anything buys 600 ticks, posting the quadrant it is actually standing in buys 2400. Blank where the feature is off.'],
 ['reclaimed','reclaimed','Organisms reclaimed for failing to renew their lease - death by obligation rather than by hunger. This is what makes doing nothing fatal; a nop-only genome cannot starve, because nop costs nothing.'],
 ['quadrants','quadrants','Where the population is standing, as NW/NE/SW/SE percentages. The quadrants are not equal: NW regenerates at 1.25 against 0.65, 0.40 and 0.75, pays 1.35x on harvest yield and charges 0.65x for the harvest instruction, so a crowd there is the map being obeyed rather than a preference. NE discounts scan and move, SW discounts build and salvage, SE discounts every comms and arithmetic instruction and pays 1.75x on task rewards.'],
 ['cost','cost','Thermal cost multiplier. Every instruction costs this many times its base price, derived from Odin\'s actual Tctl reading against a slow trailing baseline. 1.0x means the box is cool.'],
 ['subsidy','subsidy','How much of the grazing subsidy remains. Tile yield decays linearly to zero over 500,000 ticks and does not come back; at 0% harvesting pays nothing and only tasks, royalties and salvage remain. Resets when the colony reseeds.'],
 ['memory','memory','Real resident memory of this colony\'s process against its cgroup ceiling. Genome reservations commit actual pages, so this is RSS rather than a counter.'],
];
function n(v){return (v===undefined||v===null)?0:v}
function f(v){return n(v).toLocaleString()}
const panels=new Map();

function draw(cv,d){
  if(!d.energy)return;
  if(cv.width!==d.width*S){cv.width=d.width*S;cv.height=d.height*S}
  const x=cv.getContext('2d');
  for(let i=0;i<d.energy.length;i++){
    let color=ramp[+d.energy[i]]||ramp[0],
        biome=+(d.biomeField||'0')[i],
        built=A.indexOf((d.structureField||'')[i]),
        signal=parseInt((d.signalField||'0')[i],13)||0,
        scrap=A.indexOf((d.scrapField||'')[i]);
    const px=(i%d.width)*S,py=Math.floor(i/d.width)*S;
    color=mix(color,biomeColors[biome]||biomeColors[0],.10);
    if(built>0)color=mix(color,'#24d18f',Math.min(.65,.16+built/40));
    if(signal>0)color=mix(color,'#68dfff',Math.min(.75,.2+signal/20));
    x.fillStyle=color;x.fillRect(px,py,S,S);
    if(scrap>0){const size=Math.min(5,2+Math.floor(scrap/8));
      x.fillStyle='#ffb347';x.beginPath();x.arc(px+S-3,py+3,size/2,0,Math.PI*2);x.fill()}
  }
  const o=d.organisms||'';
  for(let i=0;i+3<o.length;i+=4){
    const idx=A.indexOf(o[i])*1024+A.indexOf(o[i+1])*32+A.indexOf(o[i+2]);
    if(idx<0||idx>=d.width*d.height)continue;
    x.fillStyle=strains[A.indexOf(o[i+3])%strains.length];
    x.fillRect((idx%d.width)*S,Math.floor(idx/d.width)*S,S,S);
  }
}

// Built once per colony; every later poll writes into these nodes instead of
// rebuilding the DOM, which is what makes a 100ms refresh viable at all.
function build(c){
  const el=document.createElement('div');
  el.className='col';
  el.innerHTML=`<div class="top"><span class="nm">COLONY ${c.label.toUpperCase()}</span>
      <span class="ep" title="Current epoch number and tick. An epoch ends when every organism dies (or you press RESEED) and a fresh one is seeded - from ancestral founders, or from a living peer if this colony has --peers."></span></div>
    <div class="feat" title="Which optional instruction groups this colony implements. A disabled opcode executes as a nop rather than being absent, so genomes stay comparable across colonies."></div>
    <div class="body"><canvas></canvas><div class="stats">
      ${ROWS.map(([k,id,tip])=>`<span class="k" title="${tip.replace(/"/g,'&quot;')}">${k}</span><span class="v" data-v="${id}" title="${tip.replace(/"/g,'&quot;')}"></span>`).join('')}
    </div></div>
    <div class="bar" title="Grazing subsidy remaining - the bar empties as tile yield is withdrawn toward zero."><i style="width:0"></i></div>
    <div class="gen" title="The most common genome in this colony, one character per instruction. Colours on the map show which founder lineage each organism descends from."></div>`;
  const v={};
  el.querySelectorAll('[data-v]').forEach(e=>v[e.dataset.v]=e);
  const rec={el,v,ep:el.querySelector('.ep'),feat:el.querySelector('.feat'),
             cv:el.querySelector('canvas'),bar:el.querySelector('.bar i'),
             gen:el.querySelector('.gen')};
  panels.set(c.label,rec);
  document.getElementById('fleet').appendChild(el);
  return rec;
}
function set(node,text,warn){
  if(node.textContent!==text)node.textContent=text;
  node.classList.toggle('warn',!!warn);
}
function update(c){
  const p=panels.get(c.label)||build(c);
  p.el.classList.toggle('down',!c.up);
  if(!c.up){set(p.ep,`:${c.port} ${c.error||'down'}`,true);return}
  const P=c.predation||{},G=c.groups||{},F=c.frontier||{},M=c.machine||{},W=c.weather||{},X=c.complexity||{};
  const sub=(M.subsidy!==undefined?M.subsidy:W.subsidy);
  set(p.ep,`epoch ${f(c.epoch)} · t${f(c.tick)}`);
  const feats=(c.features&&c.features.length)?c.features.join(' · '):null;
  if(p.feat.dataset.f!==String(feats)){p.feat.dataset.f=String(feats);
    p.feat.innerHTML=feats||'<span class="none">no features</span>'}
  set(p.v.population,f(c.population));
  set(p.v.generation,f(c.generation));
  set(p.v.complexity,`${n(X.median)} / ${n(X.max)}`);
  set(p.v.tasks,String(Object.keys(c.tasks||{}).length));
  set(p.v.groups,`${n(G.bound)} in ${n(G.count)}`);
  set(p.v.steals,f(P.steals),n(P.steals)>0);
  set(p.v.corrupted,f(P.corruptions),n(P.corruptions)>0);
  set(p.v.predators,f(P.carriers),n(P.carriers)>0);
  set(p.v.bus,`${f(c.bus&&c.bus.writes)}/${f(c.bus&&c.bus.reads)}`);
  set(p.v.macros,f(F.macroRuns));
  set(p.v.bounties,f(F.bountyClaims));
  set(p.v.burns,f(F.burns));
  const L=c.lease||{};
  set(p.v.lease,L.active?`${f(L.renewals)} · ${f(L.exact)} exact`:'—');
  set(p.v.reclaimed,L.active?`${f(L.expired)} · ${f(L.medianRemaining)} left`:'—',n(L.expired)>0);
  const B=c.biomePopulations;
  if(B&&B.length===4){
    const bt=B[0]+B[1]+B[2]+B[3];
    // Flag when one quadrant holds more than half - the shape that revealed
    // the frozen climate multiplier, and the shape worth noticing again.
    set(p.v.quadrants,bt?B.map(x=>Math.round(100*x/bt)).join('/'):'—',
        bt>0&&Math.max(...B)/bt>0.5);
  }else set(p.v.quadrants,'—');
  set(p.v.cost,n(c.cost)+'x',n(c.cost)>1.6);
  set(p.v.subsidy,sub===undefined?'n/a':Math.round(sub*100)+'%');
  set(p.v.memory,`${Math.round(n(c.memoryBytes)/1e6)}/${Math.round(n(c.memoryMaxBytes)/1e6)}M`);
  p.bar.style.width=(sub===undefined?0:Math.round(sub*100))+'%';
  set(p.gen,(c.dominant||'').slice(0,120));
  draw(p.cv,c);
}

let timer=null,inflight=false,frames=[],period=3000;
async function tick(){
  if(inflight)return;                       // never stack requests
  inflight=true;
  try{
    const r=await fetch('/api/fleet',{cache:'no-store'});
    const d=await r.json();
    let pop=0,up=0;
    d.colonies.forEach(c=>{update(c);if(c.up){up++;pop+=n(c.population)}});
    const now=performance.now();
    frames.push(now);frames=frames.filter(t=>t>now-5000);
    document.getElementById('meta').innerHTML=
      `${up}/${d.colonies.length} colonies · ${pop.toLocaleString()} organisms · `+
      `<span id="fps">${(frames.length/5).toFixed(1)} updates/s</span>`;
  }catch(e){
    document.getElementById('meta').textContent='fleet endpoint unreachable';
  }finally{inflight=false}
}
function schedule(ms){
  period=ms;
  if(timer)clearInterval(timer);
  timer=setInterval(tick,ms);
  document.getElementById('rate').textContent=LABEL[STEPS.indexOf(ms)];
  try{localStorage.setItem('fleetRate',String(ms))}catch(e){}
}
const slider=document.getElementById('hz');
slider.oninput=()=>schedule(STEPS[+slider.value]);
let saved=3000;
try{const v=parseInt(localStorage.getItem('fleetRate'));if(STEPS.includes(v))saved=v}catch(e){}
slider.value=String(STEPS.indexOf(saved));
schedule(saved);
tick();
</script></body></html>
